[tool.poetry]
name = "telegram-bot"
version = "0.1.0"
description = "Telegram bot for tasks and reminders"
authors = ["Your Name <your.email@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
aiogram = "^3.26.0"
asyncpg = "^0.31.0"
sqlalchemy = "^2.0.48"
alembic = "^1.18.4"
redis = "^7.3.0"
python-dotenv = "^1.2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-env = "^1.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"