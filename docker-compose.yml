version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6380:6379"

  bot:
    build: .
    depends_on:
      - db
      - redis
    env_file:
      - .env
    volumes:
      - ./bot:/app/bot

volumes:
  postgres_data: